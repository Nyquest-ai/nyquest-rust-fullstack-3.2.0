name: Publish Docker image to GHCR

# Triggers:
#   - any new tag matching v* (e.g. v3.2.0, v3.2.1) → builds + publishes
#   - manual run from the Actions tab (workflow_dispatch) → use this to
#     publish the existing v3.2.0 tag retroactively the first time
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Decoupled from the repo name so the image stays portable if the repo
  # ever gets renamed or moved. Lowercase required by OCI.
  IMAGE_NAME: nyquest-ai/nyquest-engine

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io/<owner>/<image>

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates the tag set from the git ref:
      #   v3.2.0   → 3.2.0, 3.2, 3, latest
      #   v3.2.1   → 3.2.1, 3.2, 3, latest
      #   manual   → ref-<branch>
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache so reruns don't recompile cargo deps from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 only for now. Add linux/arm64 here when there's demand
          # (doubles build time roughly).
          platforms: linux/amd64
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "## Published images"
            echo
            echo '| Tag | Pull command |'
            echo '|---|---|'
            for t in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
              echo "| \`$t\` | \`docker pull $t\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
